<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataBanq Platform</title>

<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* RESET */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}

/* 🔥 BRAND SYSTEM (FIXED + UPGRADED) */
:root {
--g400:#00FFB2;
--g500:#00D49A;
--g600:#009E73;
--g900:#041f14;
--glow:#00FFB2;
--glow-dim:rgba(0,255,178,0.12);

--bg:#050807;
--bg1:#081110;
--bg2:#0B1F1C;
--bg3:#102823;

--b1:rgba(0,255,178,0.12);
--b2:rgba(255,255,255,0.06);
--b3:rgba(255,255,255,0.04);

--t1:#E6FFF6;
--t2:rgba(230,255,246,0.65);
--t3:rgba(230,255,246,0.35);
--t4:rgba(230,255,246,0.18);

--red:#FF6B6B;
--yel:#FFD166;
--blu:#7C8CFF;

--sw:216px;
--th:48px;
}

/* 🌌 BACKGROUND GLOW */
body{
font-family:'Plus Jakarta Sans',sans-serif;
color:var(--t1);
background:
radial-gradient(circle at 20% 10%, rgba(0,255,178,0.08), transparent 40%),
radial-gradient(circle at 80% 90%, rgba(0,255,178,0.05), transparent 50%),
var(--bg);
}

/* SCROLL */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--b1)}

/* LAYOUT */
.shell{display:flex;flex-direction:column;height:100vh}
.workspace{display:flex;flex:1}

/* 🔥 TOPBAR UPGRADE */
.topbar{
height:var(--th);
display:flex;align-items:center;
background:linear-gradient(to right, rgba(5,8,7,0.95), rgba(0,255,178,0.03));
border-bottom:1px solid var(--b2);
}

/* LOGO */
.brand-logo{
width:28px;height:28px;
filter:drop-shadow(0 0 10px rgba(0,255,178,0.6));
}

.tb-brand{
width:var(--sw);
display:flex;align-items:center;gap:10px;
padding:0 16px;border-right:1px solid var(--b2);
}

.brand-wordmark{
font-weight:700;
font-size:15px;
}

/* BUTTON */
.btn-primary{
background:linear-gradient(135deg,var(--g500),var(--g400));
color:black;
padding:8px 16px;
border:none;border-radius:8px;
cursor:pointer;
box-shadow:0 4px 20px rgba(0,255,178,.25);
transition:.2s;
}
.btn-primary:hover{
transform:translateY(-1px);
box-shadow:0 8px 30px rgba(0,255,178,.4);
}

/* SIDEBAR */
.sidebar{
width:var(--sw);
background:var(--bg1);
border-right:1px solid var(--b2);
padding:10px;
}

.nav-item{
padding:10px;
border-radius:8px;
cursor:pointer;
color:var(--t2);
}
.nav-item.active{
background:rgba(0,255,178,0.1);
color:var(--g400);
}

/* MAIN */
.main{flex:1;padding:20px;overflow:auto}

/* CARDS */
.card{
background:var(--bg1);
border:1px solid var(--b2);
border-radius:12px;
padding:16px;
transition:.2s;
}
.card:hover{
box-shadow:0 0 25px rgba(0,255,178,0.08);
}

/* KPI */
.kpi{
font-size:28px;
font-weight:800;
color:var(--g400);
}

/* TITLE */
.title{
font-size:22px;
font-weight:800;
text-shadow:0 0 12px rgba(0,255,178,0.25);
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="shell">

<!-- TOPBAR -->
<div class="topbar">
  <div class="tb-brand">
    <img src="logo.png" class="brand-logo">
    <div class="brand-wordmark">DataBanq</div>
  </div>
</div>

<div class="workspace">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="nav-item active">Dashboard</div>
  <div class="nav-item">Integrations</div>
  <div class="nav-item">Shadow AI</div>
  <div class="nav-item">Consent</div>
  <div class="nav-item">Audit</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="title">Dashboard</div>

<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">

<div class="card">
  <div>Active Vendors</div>
  <div class="kpi">7</div>
</div>

<div class="card">
  <div>Alerts</div>
  <div class="kpi" style="color:red">3</div>
</div>

<div class="card">
  <div>Consent</div>
  <div class="kpi" style="color:gold">84%</div>
</div>

<div class="card">
  <div>Audit Ready</div>
  <div class="kpi">72%</div>
</div>

</div>

<button class="btn-primary">Generate Audit Pack</button>

</div>
</div>
</div>

</body>
</html>

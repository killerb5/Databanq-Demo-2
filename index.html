<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataBanq — AI Governance for the Compliance Era</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap');

/* ===== BRAND SYSTEM ===== */
:root {
  --font-display: 'Montserrat', -apple-system, sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;

  --neon: #6EFFA3;
  --matrix: #00FF88;
  --accent: #3BFFB0;

  --bg: #0A0A0A;
  --card: #0F1A18;
  --card2: #111F1C;

  --white: #FFFFFF;
  --muted: rgba(255,255,255,0.5);

  --border: rgba(0,255,136,0.25);
}

/* ===== BASE ===== */
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-display);
  background: var(--bg);
  color: white;
  overflow-x:hidden;
}

/* GLOBAL GLOW */
body::after {
  content:'';
  position:fixed;
  top:20%;
  left:50%;
  width:700px;
  height:700px;
  background: radial-gradient(circle, rgba(0,255,136,0.08), transparent);
  transform: translateX(-50%);
  pointer-events:none;
}

/* ===== NAV ===== */
nav {
  position:fixed;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(20px);
}

.nav-logo-text span {
  background: linear-gradient(90deg,#00FF88,#6EFFA3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.nav-cta {
  background: linear-gradient(90deg,#00FF88,#6EFFA3);
  color:black;
  padding:10px 18px;
  border-radius:8px;
  box-shadow:0 0 25px rgba(0,255,136,0.4);
}

/* ===== HERO ===== */
.hero {
  padding:140px 40px;
}

.gradient-text {
  background: linear-gradient(90deg,#00FF88,#6EFFA3,#3BFFB0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero h1 span {
  text-shadow:0 0 40px rgba(0,255,136,0.5);
}

.btn-primary {
  background: linear-gradient(90deg,#00FF88,#6EFFA3);
  color:black;
  box-shadow:0 0 30px rgba(0,255,136,0.4);
  transition:0.3s;
}

.btn-primary:hover {
  transform:translateY(-2px);
  box-shadow:0 0 45px rgba(0,255,136,0.7);
}

/* ===== CARDS ===== */
.feature-card,
.problem-item,
.icp-card,
.price-card {
  transition: all 0.3s ease;
}

.feature-card:hover,
.problem-item:hover,
.icp-card:hover,
.price-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 40px rgba(0,255,136,0.15);
  border-color: rgba(0,255,136,0.3);
}

/* ===== ACCENTS ===== */
.section-eyebrow {
  background: linear-gradient(90deg,#00FF88,#6EFFA3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.accent {
  background: linear-gradient(90deg,#00FF88,#6EFFA3,#3BFFB0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===== CTA ===== */
.cta-btn {
  background: linear-gradient(90deg,#00FF88,#6EFFA3);
  box-shadow:0 0 30px rgba(0,255,136,0.4);
}

</style>
</head>

<body>

<nav>
  <div class="nav-logo-text">Data<span>Banq</span></div>
  <a class="nav-cta">Request Demo</a>
</nav>

<section class="hero">
  <h1>
    AI Governance for the<br>
    <span class="accent">Compliance Era.</span>
  </h1>

  <p>
    DataBanq gives fintech and healthtech teams a complete AI governance layer — consent management, shadow AI detection, model lineage tracking, and audit-ready reporting.
  </p>

  <br>

  <a class="btn-primary">Request Demo</a>
</section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataBanq — AI Governance for the Compliance Era</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
:root {
--bg: #0A0F10;
--bg-soft: #0E1416;
--card: #11191B;
--card-hover: #152124;

--text: #E6F1EF;
--muted: rgba(230,241,239,0.55);

--primary: #5B9F7A;
--primary-strong: #6FE3A8;

--border: rgba(255,255,255,0.06);
--border-strong: rgba(91,159,122,0.25);
}

body {
margin: 0;
font-family: 'Inter', sans-serif;
background: var(--bg);
color: var(--text);
}

/* ===== NAV ===== */
nav {
position: fixed;
top: 0;
left: 0;
right: 0;
height: 60px;
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 48px;
background: rgba(10,15,16,0.9);
border-bottom: 1px solid var(--border);
z-index: 100;
}

.nav-logo {
display: flex;
align-items: center;
gap: 10px;
text-decoration: none;
}

.nav-logo-mark {
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
border: 1px solid var(--border-strong);
border-radius: 8px;
}

.nav-logo-text {
font-weight: 800;
color: white;
}

.nav-logo-text span {
color: var(--primary);
}

.nav-links {
display: flex;
gap: 28px;
list-style: none;
}

.nav-links a {
color: var(--muted);
text-decoration: none;
font-size: 14px;
}

.nav-cta {
background: var(--primary);
color: #04110c;
padding: 8px 16px;
border-radius: 6px;
font-weight: 600;
}

/* ===== HERO ===== */
.hero {
min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
padding: 120px 48px;
}

.hero h1 {
font-size: 72px;
font-weight: 800;
line-height: 1.05;
}

.accent {
color: var(--primary);
}

.hero-sub {
margin-top: 20px;
color: var(--muted);
max-width: 500px;
}

.btn-primary {
margin-top: 30px;
display: inline-block;
background: var(--primary);
color: #04110c;
padding: 14px 26px;
border-radius: 8px;
text-decoration: none;
}

/* ===== PRODUCT PREVIEW ===== */
.product-preview {
padding: 100px 48px;
border-top: 1px solid var(--border);
}

.dashboard {
margin-top: 40px;
display: flex;
background: var(--card);
border: 1px solid var(--border);
border-radius: 14px;
overflow: hidden;
}

.sidebar {
width: 60px;
background: #0D1416;
padding: 16px;
display: flex;
flex-direction: column;
gap: 12px;
}

.side-item {
height: 10px;
background: rgba(255,255,255,0.1);
border-radius: 3px;
}

.side-item.active {
background: var(--primary);
}

.main {
flex: 1;
padding: 20px;
}

.row {
height: 14px;
background: rgba(255,255,255,0.06);
margin-bottom: 10px;
border-radius: 4px;
}

/* ===== PROBLEM ===== */
.problem-section {
padding: 80px 48px;
background: var(--bg-soft);
}

.problem-item {
display: flex;
gap: 10px;
margin-bottom: 20px;
}

.icon-dot {
width: 10px;
height: 10px;
background: var(--primary);
border-radius: 50%;
margin-top: 6px;
}

/* ===== CURSOR LIGHT ===== */
.cursor-light {
position: fixed;
width: 400px;
height: 400px;
background: radial-gradient(circle, rgba(91,159,122,0.12), transparent 70%);
pointer-events: none;
transform: translate(-50%, -50%);
z-index: 0;
}

</style>
</head>

<body>

<div class="cursor-light"></div>

<!-- NAV -->
<nav>
<a class="nav-logo" href="#">
<div class="nav-logo-mark">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none">
<rect x="5" y="10" width="14" height="10" rx="3" stroke="#5B9F7A" stroke-width="1.5"/>
<path d="M8 10V7a4 4 0 118 0v3" stroke="#5B9F7A" stroke-width="1.5"/>
</svg>
</div>
<div class="nav-logo-text">Data<span>Banq</span></div>
</a>
<ul class="nav-links">
<li><a href="#">Features</a></li>
<li><a href="#">Pricing</a></li>
<li><a href="#" class="nav-cta">Request Demo</a></li>
</ul>
</nav>

<!-- HERO -->
<section class="hero">
<h1>
AI Governance<br>
for the <span class="accent">Compliance Era.</span>
</h1>

<p class="hero-sub">
DataBanq gives fintech and healthtech teams a complete AI governance layer.
</p>

<a href="#" class="btn-primary">Request a Demo →</a>
</section>

<!-- PRODUCT -->
<section class="product-preview">
<h3>Platform Overview</h3>

<div class="dashboard">
<div class="sidebar">
<div class="side-item active"></div>
<div class="side-item"></div>
</div>

<div class="main">
<div class="row"></div>
<div class="row"></div>
<div class="row"></div>
</div>
</div>
</section>

<!-- PROBLEM -->
<section class="problem-section">
<div class="problem-item">
<div class="icon-dot"></div>
<div>No consent layer for AI data use</div>
</div>

<div class="problem-item">
<div class="icon-dot"></div>
<div>Shadow AI running unchecked</div>
</div>
</section>

<script>
const light = document.querySelector('.cursor-light');

document.addEventListener('mousemove', (e) => {
light.style.left = e.clientX + 'px';
light.style.top = e.clientY + 'px';
});
</script>

</body>
</html>
